<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bútorpiaci kimutatás – interaktív térkép</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22211d;--mut:#6b6962;--line:#e4e0d6;--acc:#1a5fb4;
--g1:#2f6fb0;--g2:#c2762a;--g3:#2e8b6a;--g4:#8a4fa8;--warn:#b07a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font:600 21px/1.2 Fraunces,Georgia,serif;margin:0;flex:1;min-width:240px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;padding:6px 14px;font:600 13px Inter;cursor:pointer;color:var(--mut)}
.lang button.on{background:var(--ink);color:#fff}
main{max-width:1320px;margin:0 auto;padding:16px 20px 60px}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 14px;font-size:13px}
.crumb button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font:500 13px Inter;color:var(--ink)}
.crumb button.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.crumb span{color:var(--mut)}
.top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.top{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
#map{height:520px;width:100%}
.hint{color:var(--mut);font-size:12.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:#fff;cursor:pointer;font:500 13px Inter;color:var(--ink)}
.chip i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chip.on{outline:2px solid var(--ink)}
.chip small{color:var(--mut);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfaf7}
.kpi b{display:block;font:600 22px/1.15 Inter}
.kpi span{color:var(--mut);font-size:12px}
h2{font:600 19px/1.25 Fraunces,Georgia,serif;margin:28px 0 10px}
h3{font:600 15px Inter;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid #efece5;padding:7px 8px;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#f8f6f1}
.bars{display:flex;height:10px;border-radius:3px;overflow:hidden;min-width:120px;background:#eee}
.bars div{height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:6px 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.find{display:grid;grid-template-columns:200px 1fr 1fr;gap:0}
.find div{padding:9px 10px;border-bottom:1px solid #efece5}
.find .h{font-weight:600;color:var(--mut);font-size:12px}
@media(max-width:700px){.find{grid-template-columns:1fr}}
details{background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0}
summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center}
summary small{color:var(--mut);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:0 14px 14px}
.p{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.p .ph{height:150px;background:#f3f1ec center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.p .bd{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.p .nm{font-weight:600;font-size:13px;line-height:1.3}
.p .st{color:var(--mut);font-size:12px}
.p .pr{font:700 16px Inter;margin-top:3px}
.p .pr s{color:var(--mut);font-weight:400;font-size:12px;margin-left:6px}
.p .kp{font-size:12px;color:var(--g3)}
.p .sp{font-size:12px;color:#3d3b36}
.p .miss{color:var(--warn)}
.p a{color:var(--acc);font-size:12.5px;margin-top:auto;padding-top:6px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;background:#f1eee7;color:#4a4842;margin:2px 3px 0 0}
.tag.red{background:#fbe3dc;color:#9b2c12}
.sort{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);padding:0 14px 8px}
.sort select{font:13px Inter;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.empty{padding:20px;color:var(--mut)}
.src{color:var(--mut);font-size:12px;margin-top:30px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.twocol{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><div class="hwrap">
<h1 id="ttl"></h1>
<div class="lang" id="lang"><button data-l="HU">HU</button><button data-l="EN">EN</button><button data-l="DE">DE</button></div>
</div></header>
<main>
<div class="crumb" id="crumb"></div>
<div class="top">
 <div class="card"><div id="map"></div><div class="hint" id="hint"></div></div>
 <div class="card">
  <h3 id="selTitle"></h3>
  <div class="chips" id="chips"></div>
  <div class="kpis" id="kpis"></div>
  <div class="hint" id="note"></div>
 </div>
</div>
<div id="rep"></div>
<div class="src" id="src"></div>
</main>

function lighten(h,a){var n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r+(255-r)*a);g=Math.round(g+(255-g)*a);b=Math.round(b+(255-b)*a);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

/* ---------- report ---------- */
function bandsBar(rows){var n=rows.length||1,h='<div class="bars">';[1,2,3,4,5,0].forEach(function(b){var k=rows.filter(function(r){return r.b===b}).length;if(k)h+='<div title="'+bandName(b)+': '+k+'" style="width:'+(k/n*100)+'%;background:'+BC[b]+'"></div>'});return h+'</div>'}

function groupTable(title,keys,label,rowsOf,onclick){
 var h='<div class="card"><h3>'+title+'</h3>'+legend()+'<div class="scroll"><table><tr><th>'+t('name')+'</th><th class="n">'+t('n')+'</th><th class="n">'+t('avg')+'</th><th class="n">'+t('min')+'</th><th class="n">'+t('max')+'</th><th>'+t('bands')+'</th></tr>';
 keys.forEach(function(k){var R=rowsOf(k);if(!R.length&&!onclick)return;var P=R.map(function(r){return r.p});

function findings(R){
 var out=[],P=R.map(function(r){return r.p}),stores={};
 R.forEach(function(r){(stores[r.a]=stores[r.a]||[]).push(r.p)});
